name: OCG iOS Build


on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Sign and upload to TestFlight using configured secrets
        type: boolean
        default: false


permissions:
  contents: read


jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4


      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version


      - name: Extract app source
        run: unzip -o OCG_iPhone_App_Source_PayPal_Checkout_Fix.zip -d app-source




      - name: Use Stripe cart in iOS app
        run: python3 patch-ios-cart.py app-source/ios/OCGMarketplace/App.swift

      - name: Install build tool
        run: brew install xcodegen


      - name: Generate Xcode project
        working-directory: app-source/ios
        run: |
          xcodegen generate
          python3 -c 'import plistlib; p="Generated/Info.plist"; d=plistlib.load(open(p,"rb")); d["UISupportedInterfaceOrientations~ipad"]=["UIInterfaceOrientationPortrait","UIInterfaceOrientationPortraitUpsideDown","UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]; plistlib.dump(d,open(p,"wb"))'
        
        


      - name: Build simulator app
        working-directory: app-source/ios
        run: >-
          xcodebuild -project OCGMarketplace.xcodeproj
          -scheme OCGMarketplace -sdk iphonesimulator
          -configuration Debug -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build


      - name: Test app
        if: ${{ !inputs.upload_to_testflight }}
        timeout-minutes: 15
        working-directory: app-source/ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,group in d["devices"].items() if "iOS-26" in runtime for x in group if x["name"].startswith("iPhone")))')
          xcodebuild -project OCGMarketplace.xcodeproj -scheme OCGMarketplace -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO test


      - name: Install signing credentials
        if: inputs.upload_to_testflight
        env:
          DISTRIBUTION_P12: ${{ secrets.OCG_DISTRIBUTION_P12 }}
