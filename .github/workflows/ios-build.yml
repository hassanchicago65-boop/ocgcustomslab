name: OCG iOS Build


on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Sign and upload to TestFlight using configured secrets
        type: boolean
        default: false


permissions:
  contents: read


jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4


      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version


      - name: Extract app source
        run: unzip -o OCG_iPhone_App_Source_PayPal_Checkout_Fix.zip -d app-source

      - name: Use Stripe cart in iOS app
        run: python3 patch-ios-cart.py app-source/ios/OCGMarketplace/App.swift


      - name: Install build tool
        run: brew install xcodegen


      - name: Generate Xcode project
        working-directory: app-source/ios
        run: |
          xcodegen generate
          python3 -c 'import plistlib; p="Generated/Info.plist"; d=plistlib.load(open(p,"rb")); d["UISupportedInterfaceOrientations~ipad"]=["UIInterfaceOrientationPortrait","UIInterfaceOrientationPortraitUpsideDown","UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]; plistlib.dump(d,open(p,"wb"))'
